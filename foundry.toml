[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }

remappings = [
    "forge-std=dependencies/forge-std-1.16.2/src",
]

[fmt]
line_length = 110
tab_width = 4

[dependencies]
forge-std = "1.16.2"
